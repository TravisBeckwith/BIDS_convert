name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint bids_convert.sh
        run: shellcheck -x bids_convert.sh
      - name: Lint test script
        run: shellcheck -x tests/test_bids_convert.sh

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install dcm2niix
        if: runner.os == 'Linux'
        run: sudo apt-get install -y dcm2niix
      - name: Install dcm2niix (macOS)
        if: runner.os == 'macOS'
        run: brew install dcm2niix
      - name: Make scripts executable
        run: chmod +x bids_convert.sh tests/test_bids_convert.sh
      - name: Run tests
        run: bash tests/test_bids_convert.sh
