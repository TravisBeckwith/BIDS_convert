###############################################################################
# BIDS Folder-to-Modality Mapping Configuration
#
# Format (tab or space separated):
#   <source_folder_pattern>   <bids_modality>   <bids_suffix>   [task_label]
#
# Patterns use bash globbing (case-insensitive).
# Lines starting with # are comments.
# First matching rule wins — put specific patterns before general ones.
#
# Available modalities: anat, func, dwi, fmap, perf, pet
# See https://bids-specification.readthedocs.io/ for valid suffixes
###############################################################################

# ── Anatomical ──────────────────────────────────────────────────────────────
SAG*T1*             anat        T1w
*MPRAGE*            anat        T1w
*T1W*               anat        T1w
SAG                 anat        T1w
*T2W*               anat        T2w
*FLAIR*             anat        FLAIR

# ── Diffusion ───────────────────────────────────────────────────────────────
*DTI*               dwi         dwi
*DWI*               dwi         dwi
*HARDI*             dwi         dwi

# ── Functional ──────────────────────────────────────────────────────────────
*REST*BOLD*         func        bold        rest
*BOLD*REST*         func        bold        rest
*RESTING*           func        bold        rest
*NBACK*             func        bold        nback
*MOTOR*             func        bold        motor
*LANGUAGE*          func        bold        language
*BOLD*              func        bold        unknown

# ── Fieldmaps ───────────────────────────────────────────────────────────────
*PHASE*DIFF*        fmap        phasediff
*MAGNITUDE*         fmap        magnitude
*TOPUP*AP*          fmap        epi
*TOPUP*PA*          fmap        epi

# ── Perfusion ───────────────────────────────────────────────────────────────
*ASL*               perf        asl
*PCASL*             perf        asl

# ── PET ─────────────────────────────────────────────────────────────────────
*PET*               pet         pet
*FDG*               pet         pet
